name: Validar EFG Training
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar sintaxis Python
        run: python -m py_compile app.py visuals.py watch.py timer.py session_detail.py new_blocks.py block_views.py efg_watch_dashboard.py efg_walks_dashboard.py
      - name: Validar separación de bloques e identidad de ejercicios
        run: python -m unittest -v test_blocks.py
      - name: Validar el máximo móvil de cargas (sin instalar Streamlit)
        run: |
          python - <<'PY'
          import ast, json, math, pathlib
          from datetime import date, timedelta
          app = ast.parse(pathlib.Path("app.py").read_text(encoding="utf-8"))
          target = next(node for node in app.body
              if isinstance(node, ast.FunctionDef) and node.name == "monthly_maximum_weights")
          code = compile(ast.Module(body=[target], type_ignores=[]), "<maximo-movil>", "exec")
          namespace = {"date": date, "timedelta": timedelta, "math": math}
          exec(code, namespace)
          fn = namespace["monthly_maximum_weights"]
          entries = json.loads(pathlib.Path("data/plan.json").read_text(encoding="utf-8"))["entries"]
          maxima = fn(entries, [], as_of=date(2026, 10, 12))
          assert abs(maxima["extension de cuadriceps"]["kg"] / 0.45359237 - 235.0) < .1
          session = {"date": "2026-10-12", "exercise": "Extension de cuadriceps",
                     "sets": [{"kg": 120, "reps": 10}]}
          updated = fn(entries, [session], as_of=date(2026, 10, 12))
          assert abs(updated["extension de cuadriceps"]["kg"] - 120) < .001
          fallback = fn(entries, [], as_of=date(2027, 3, 15))
          assert fallback["extension de cuadriceps"]["source"] == "excel_inicial"
          print("OK: máximo móvil y actualización por sesión real")
          PY
      - name: Validar plan actualizado, historial y Apple Watch
        run: |
          python - <<'PY'
          import json, pathlib
          from datetime import date

          folder = pathlib.Path("data")
          plan = json.loads((folder / "plan.json").read_text(encoding="utf-8"))
          entries = plan["entries"]
          assert plan["weeks"] == 12
          assert isinstance(entries, list) and len(entries) >= 500
          assert len({entry["id"] for entry in entries}) == len(entries)
          assert {int(entry["day"]) for entry in entries} == set(range(1, 6))
          assert {int(entry["week"]) for entry in entries} == set(range(1, 13))
          assert all(entry.get("exercise") and entry.get("series") for entry in entries)

          # Foto de referencia del miércoles: 9 ejercicios, mismo orden,
          # durante las doce semanas sin inventar sesiones realizadas.
          reference = [
              "Giros rusos", "Abdominales bisagra", "Elevaciones de piernas",
              "Press francés con mancuernas", "Flexiones para tríceps",
              "Fondos en paralelas", "Curl martillo", "Tríceps con soga",
              "Curl 21 con barra Z",
          ]
          for week in range(1, 13):
              w = [item for item in entries if int(item["week"]) == week]
              assert len(w) >= 40, (week, len(w))
              for day in range(1, 6):
                  assert any(int(item["day"]) == day for item in w), (week, day)
              wed = [item for item in w if int(item["day"]) == 3]
              assert [item["exercise"] for item in wed] == reference, (week, wed)
              assert all(item.get("planned_load") for item in wed)
          assert not any(e.get("weekly_report") for e in entries if int(e["week"]) >= 5)
          assert not any(e.get("reference_weight_lb") is not None for e in entries if int(e["week"]) >= 5)
          assert any(isinstance(e.get("reference_series_kg"), list)
                     and len(e["reference_series_kg"]) == 4 for e in entries)
          blob = (folder / "plan.json").read_text(encoding="utf-8").casefold()
          assert "belutrainer" not in blob and "rutina diseñada por" not in blob

          history = json.loads((folder / "history.json").read_text(encoding="utf-8"))
          sessions = history["sessions"]
          assert isinstance(sessions, list)
          assert len({session["id"] for session in sessions}) == len(sessions)
          for session in sessions:
              date.fromisoformat(session["date"])
              assert isinstance(session.get("sets"), list)
              for row in session["sets"]:
                  assert isinstance(row, dict)
                  # Las cargas pueden quedar pendientes (kg = null);
                  # no deben transformarse en cero ficticio.
                  assert row.get("kg") is None or isinstance(row["kg"], (int, float))
                  assert row.get("reps") is None or isinstance(row["reps"], int)

          weights = json.loads((folder / "weight.json").read_text(encoding="utf-8"))
          assert isinstance(weights["measurements"], list)
          watch = json.loads((folder / "apple_watch.json").read_text(encoding="utf-8"))
          assert isinstance(watch.get("workouts"), list)

          walks = json.loads((folder / "walks.json").read_text(encoding="utf-8"))
          assert isinstance(walks.get("walks"), list)
          assert len({x["id"] for x in walks["walks"]}) == len(walks["walks"])
          for item in walks["walks"]:
              date.fromisoformat(item["date"])
              assert item["distance_km"] > 0
              assert item["moving_duration_seconds"] > 0
              assert item["elapsed_seconds"] >= item["moving_duration_seconds"]
              assert item["total_kcal"] >= item["active_kcal"] >= 0
              assert item["capture_only"] is True
              assert item["belongs_to_strength_session"] is False
          assert any(
              x["date"] == "2026-10-17" and x["distance_km"] == 4.57
              and x["moving_duration_seconds"] == 3081
              and x["average_hr_bpm"] == 105
              for x in walks["walks"]
          )
          print("OK: rutina, historial, capturas Apple Fitness y caminatas")
          PY
      - name: Verificar arranque de la app Streamlit sin datos externos
        run: |
          python -m pip install -q -r requirements.txt
          python - <<'PY'
          import base64
          from pathlib import Path
          from unittest.mock import patch
          from streamlit.testing.v1 import AppTest

          class LocalResponse:
              def __init__(self, url):
                  self.path = url.split("/contents/", 1)[-1]
              def raise_for_status(self):
                  return None
              def json(self):
                  content = Path(self.path).read_bytes()
                  return {"content": base64.b64encode(content).decode("ascii"),
                          "sha": "local-ci-check"}

          with patch("requests.get", side_effect=lambda url, **kwargs: LocalResponse(url)):
              app = AppTest.from_file("app.py", default_timeout=90).run()
          issues = [str(x.message) for x in app.exception]
          assert not issues, issues
          print("OK: EFG Training arranca con el plan y el historial actual")
          PY
